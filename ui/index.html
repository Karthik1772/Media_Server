<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b10" />
    <meta name="color-scheme" content="dark light" />
    <title>__TITLE__</title>
    <script>
      /* set the theme before the first paint so light-theme users never see a dark flash */
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem("theme") || "null");
          if (t !== "light" && t !== "dark")
            t = matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/__ui/style.css" />
    <link rel="icon" type="image/png" href="/__ui/assets/Favicon.png" />
    <link rel="apple-touch-icon" href="/__ui/assets/Favicon.png" />
  </head>
  <body>
    <div id="splash" class="splash" aria-hidden="true">
      <div class="splash-in">
        <img class="splash-logo" src="/__ui/assets/Logo.png" alt="" />
        <div class="splash-bar"><i></i></div>
      </div>
    </div>
    <script>
      // splash plays once per browser session, so moving between folders stays instant
      (function () {
        var el = document.getElementById("splash");
        try {
          if (sessionStorage.getItem("splashSeen")) return el.remove();
          sessionStorage.setItem("splashSeen", "1");
        } catch (e) {}
        var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        setTimeout(
          function () {
            el.classList.add("out");
            setTimeout(function () {
              el.remove();
            }, 600);
          },
          reduce ? 500 : 1900,
        );
      })();
    </script>
    <header class="top">
      <a class="logo" href="/">
        <img class="logo-img" src="/__ui/assets/Favicon.png" alt="" />
        <b>__APPNAME__</b>
      </a>
      <div class="search">
        <span>&#128269;</span
        ><input
          id="q"
          type="search"
          placeholder="Search this folder   ( / )"
          autocomplete="off"
        />
      </div>
      <button
        id="themeToggle"
        class="theme-toggle"
        type="button"
        aria-label="Switch to light theme"
        title="Toggle theme"
      >
        ☀️
      </button>
    </header>
    <main class="wrap">
      <nav id="crumbs" class="crumbs"></nav>
      <div class="head">
        <div>
          <h1 id="title"></h1>
          <div id="stats" class="stats"></div>
        </div>
        <div class="tools">
          <select id="sort" title="Sort">
            <option value="name">Name</option>
            <option value="date">Newest</option>
            <option value="size">Largest</option>
          </select>
          <div class="seg">
            <button id="bgrid" title="Grid">&#9638;</button
            ><button id="blist" title="List">&#9776;</button>
          </div>
        </div>
      </div>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" hidden>Nothing here.</div>
    </main>

    <div id="player" class="ov" hidden>
      <div id="stage" class="stage">
        <video id="vid" playsinline></video>
        <audio id="aud" preload="auto"></audio>
        <div id="subs"></div>
        <div id="pspin" class="pspin" hidden>
          <img class="pspin-logo" src="/__ui/assets/Logo.png" alt="" />
          <i></i><span id="pspinTxt"></span>
        </div>
        <div id="ghud" class="ghud" hidden></div>
      </div>
      <div class="pbar">
        <button class="btn" id="pclose">&#10005; Close</button>
        <div class="t" id="ptitle"></div>
        <button class="btn" id="pvlc" title="Open in VLC">VLC</button>
        <a class="btn" id="pdl" download>&#11015;</a>
      </div>
      <div id="pchip" class="pchip" hidden>
        <i class="cspin"></i><span id="pchipTxt"></span
        ><em class="cbar"><i></i></em>
      </div>
      <input
        id="subFile"
        type="file"
        accept=".srt,.vtt,.txt,text/plain,text/vtt,application/x-subrip,application/octet-stream"
        hidden
      />
      <div id="perr" hidden></div>
      <div id="pctrl" class="pctrl">
        <div class="seekrow">
          <span id="ptime" class="tm">0:00</span>
          <div
            id="pseek"
            class="seek"
            role="slider"
            aria-label="Seek"
            tabindex="0"
          >
            <div class="seek-bar">
              <i class="seek-buf"></i><i class="seek-fill"></i>
            </div>
            <i class="seek-knob"></i>
            <span class="seek-tip" hidden></span>
          </div>
          <span id="pdur" class="tm">0:00</span>
        </div>
        <div class="prow">
          <div class="pgrp">
            <button
              class="pbtn"
              id="pprev"
              title="Previous (P)"
              aria-label="Previous"
            ></button>
            <button
              class="pbtn"
              id="pback"
              title="Back 10 s (&larr;)"
              aria-label="Back 10 seconds"
            ></button>
            <button
              class="pbtn big"
              id="pplay"
              title="Play / pause (Space)"
              aria-label="Play"
            ></button>
            <button
              class="pbtn"
              id="pfwd"
              title="Forward 10 s (&rarr;)"
              aria-label="Forward 10 seconds"
            ></button>
            <button
              class="pbtn"
              id="pnext"
              title="Next (N)"
              aria-label="Next"
            ></button>
            <span id="pcount" class="pcount"></span>
            <button
              class="pbtn"
              id="pmute"
              title="Mute (M)"
              aria-label="Mute"
            ></button>
            <input
              id="pvol"
              type="range"
              min="0"
              max="1"
              step="0.05"
              value="1"
              aria-label="Volume"
            />
          </div>
          <div class="pgrp">
            <button
              class="pbtn txt"
              id="pspeed"
              title="Playback speed ( &lt; / &gt; )"
            >
              1&times;
            </button>
            <button
              class="pbtn"
              id="ptracks"
              title="Audio &amp; subtitles (C)"
              aria-label="Audio and subtitles"
            ></button>
            <button
              class="pbtn"
              id="pfit"
              title="Picture: fit / fill / stretch"
              aria-label="Picture fit"
            ></button>
            <button
              class="pbtn"
              id="ppip"
              title="Picture in picture"
              aria-label="Picture in picture"
              hidden
            ></button>
            <button
              class="pbtn"
              id="plock"
              title="Lock controls"
              aria-label="Lock controls"
            ></button>
            <button
              class="pbtn"
              id="pfs"
              title="Fullscreen (F)"
              aria-label="Fullscreen"
            ></button>
          </div>
        </div>
      </div>
      <div id="pmenu" class="pmenu" hidden></div>
      <button
        class="pbtn unlock"
        id="punlock"
        aria-label="Unlock controls"
        hidden
      ></button>
    </div>

    <div id="viewer" class="ov" hidden>
      <button class="btn" id="vclose">&#10005;</button>
      <button class="btn" id="vorig" hidden>Original</button>
      <button class="arrow" id="vprev">&#8249;</button>
      <img id="vimg" alt="" />
      <button class="arrow" id="vnext">&#8250;</button>
      <div id="vcap"></div>
    </div>
    <div id="toast" hidden></div>

    <section
      id="posterModal"
      class="poster-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="posterHeading"
      hidden
    >
      <div class="poster-dialog">
        <div class="poster-dialog-head">
          <div>
            <h2 id="posterHeading">Change poster</h2>
            <p id="posterFor" class="stats"></p>
          </div>
          <button
            id="posterClose"
            class="btn modal-close"
            type="button"
            aria-label="Close poster picker"
          >
            ✕
          </button>
        </div>
        <form id="posterSearchForm" class="poster-search">
          <input
            id="posterQuery"
            type="search"
            placeholder="Search movie title"
            autocomplete="off"
          />
          <input
            id="posterYear"
            type="number"
            min="1900"
            max="2100"
            placeholder="Year"
            aria-label="Release year (optional)"
          />
          <button class="action-btn" type="submit">Search posters</button>
        </form>
        <p id="posterHelp" class="poster-help">
          Searches TMDB (posters come from media.themoviedb.org) and Wikipedia.
          Pick the right poster, or paste a link below. Your choice is saved
          permanently and the automatic scan will never change it.
        </p>
        <div id="posterResults" class="poster-results"></div>
        <form id="posterLinkForm" class="poster-upload">
          <label for="posterLink"
            >Or paste a link: a TMDB movie / TV page, a Wikipedia page, or an
            image link from media.themoviedb.org / image.tmdb.org /
            upload.wikimedia.org</label
          >
          <input
            id="posterLink"
            type="url"
            inputmode="url"
            placeholder="https://www.themoviedb.org/movie/…"
            autocomplete="off"
          />
          <button id="posterLinkBtn" class="action-btn" type="submit">
            Use this link
          </button>
        </form>
        <button id="posterReset" class="text-btn" type="button">
          Reset to default poster
        </button>
      </div>
    </section>

    <script id="data" type="application/json">
      __DATA__
    </script>
    <script src="/__ui/app.js" defer></script>
  </body>
</html>
